[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"
[project]
name="youtube-automation-platform"
version="1.2.0"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.34,<1","pydantic-settings>=2.7,<3","sqlalchemy>=2.0,<3","psycopg[binary]>=3.2,<4","httpx>=0.28,<1","python-multipart>=0.0.20,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.25,<1","ruff>=0.11,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
[tool.ruff]
line-length=100
target-version="py312"
